<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#02070d" />
    <link rel="icon" href="./favicon.svg" />
    <title>J.A.R.V.I.S. MBA Task Core</title>

    <!-- original app assets -->
    <link rel="stylesheet" crossorigin href="/mba-command-centre/assets/index-CWko_d4q.css">

    <!-- JARVIS visual overlay layers -->
    <link rel="stylesheet" href="./jarvis-overrides.css">
    <link rel="stylesheet" href="./jarvis-kpi-pulse.css">
    <link rel="stylesheet" href="./jarvis-hud-background.css">
    <link rel="stylesheet" href="./jarvis-telemetry.css">
    <link rel="stylesheet" href="./jarvis-boot.css">
  </head>
  <body>
    <!-- Boot sequence overlay - shows once per session, sits on top of everything -->
    <div class="jarvis-boot" id="jarvis-boot">
      <div class="jarvis-boot-core">
        <div class="jarvis-boot-ring"></div>
        <div class="jarvis-boot-ring jarvis-boot-ring--2"></div>
        <div class="jarvis-boot-dot"></div>
      </div>
      <div class="jarvis-boot-title">J.A.R.V.I.S.</div>
      <div class="jarvis-boot-sub">MBA COMMAND CORE</div>
      <div class="jarvis-boot-log" id="jarvis-boot-log"></div>
      <div class="jarvis-boot-bar"><div class="jarvis-boot-bar-fill"></div></div>
    </div>

    <!-- HUD layers live OUTSIDE #root so React never wipes them -->
    <div class="jarvis-particles" aria-hidden="true"></div>

    <div class="jarvis-hud-bg" aria-hidden="true">
      <div class="jarvis-hex-grid"></div>
      <div class="jarvis-ring jarvis-ring--outer"></div>
      <div class="jarvis-ring jarvis-ring--inner"></div>
      <div class="jarvis-reticle"></div>
      <div class="jarvis-corner jarvis-corner--tl"></div>
      <div class="jarvis-corner jarvis-corner--tr"></div>
      <div class="jarvis-corner jarvis-corner--bl"></div>
      <div class="jarvis-corner jarvis-corner--br"></div>
    </div>

    <div class="jarvis-telemetry" aria-hidden="true">
      <div class="jarvis-telemetry-line" data-role="clock"></div>
      <div class="jarvis-telemetry-line" data-role="coords"></div>
      <div class="jarvis-telemetry-log"></div>
    </div>

    <!-- React mounts here - left empty, React owns everything inside -->
    <div id="root"></div>

    <!-- original app bundle -->
    <script type="module" crossorigin src="/mba-command-centre/assets/index-DcrtnBFE.js"></script>

    <!-- JARVIS interaction scripts -->
    <script type="module" src="./jarvis-kpi-watch.js"></script>
    <script type="module" src="./jarvis-telemetry.js"></script>
    <script type="module" src="./jarvis-interact.js"></script>
    <script type="module" src="./jarvis-boot.js"></script>
  </body>
</html>
